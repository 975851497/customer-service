<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教育智能客服 - 调试面板</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
</head>
<body class="bg-gray-100 h-screen flex flex-col">
<div class="bg-white shadow px-4 py-3 flex items-center justify-between">
  <h1 class="text-lg font-bold text-gray-800">
    <i class="fa fa-graduation-cap text-blue-600"></i>
    教育智能客服 · 调试面板
  </h1>
  <div class="flex items-center gap-4">
    <label class="flex items-center text-sm text-gray-500">
      <input id="streamMode" type="checkbox" class="mr-1" checked>
      流式
    </label>
    <div>
      <label class="text-sm text-gray-500 mr-1">用户 ID</label>
      <input id="senderId" value="user_161" class="border rounded px-2 py-1 text-sm w-28">
    </div>
    <button onclick="getSessionState()" class="bg-gray-500 text-white text-sm px-3 py-1.5 rounded hover:bg-gray-600">
      <i class="fa fa-info-circle"></i> 会话状态
    </button>
    <button onclick="getHistory()" class="bg-gray-500 text-white text-sm px-3 py-1.5 rounded hover:bg-gray-600">
      <i class="fa fa-history"></i> 历史
    </button>
    <button onclick="clearChat()" class="bg-red-500 text-white text-sm px-3 py-1.5 rounded hover:bg-red-600">
      <i class="fa fa-trash"></i> 清空
    </button>
  </div>
</div>

<div class="flex-1 flex overflow-hidden">
  <!-- 聊天区域 -->
  <div class="flex-1 flex flex-col">
    <div id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-50"></div>

    <!-- 快捷操作 -->
    <div class="bg-white border-t px-4 py-2 flex gap-2 overflow-x-auto">
      <button onclick="sendQuick('你好')" class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded-full whitespace-nowrap hover:bg-blue-200">你好</button>
      <button onclick="sendQuick('Python 全栈课程是什么情况？')" class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded-full whitespace-nowrap hover:bg-blue-200">咨询课程</button>
      <button onclick="sendQuick('帮我查下订单 ORD0000000534')" class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded-full whitespace-nowrap hover:bg-blue-200">查订单</button>
      <button onclick="sendQuick('我在后端架构进阶班的学习进度怎么样？')" class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded-full whitespace-nowrap hover:bg-blue-200">学习进度</button>
      <button onclick="sendQuick('我要退款')" class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded-full whitespace-nowrap hover:bg-blue-200">退款</button>
      <button onclick="sendQuick('我要投诉，视频加载不出来')" class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded-full whitespace-nowrap hover:bg-blue-200">投诉工单</button>
    </div>

    <!-- 输入区 -->
    <div class="bg-white border-t p-3 flex gap-2">
      <input id="msgInput" type="text" placeholder="输入消息..." class="flex-1 border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
        onkeydown="if(event.key==='Enter') sendMessage()">
      <button onclick="sendMessage()" class="bg-blue-600 text-white px-5 py-2 rounded-lg hover:bg-blue-700 text-sm">
        <i class="fa fa-send"></i> 发送
      </button>
    </div>
  </div>

  <!-- 右侧面板 -->
  <div class="w-80 bg-white border-l flex flex-col hidden lg:flex">
    <div class="border-b px-3 py-2 text-sm font-medium text-gray-600 bg-gray-50">会话状态</div>
    <div id="sessionPanel" class="flex-1 p-3 text-xs text-gray-600 overflow-y-auto font-mono">
      点击「会话状态」查看
    </div>
  </div>
</div>

<script>
const API_BASE = '';

function getSenderId() {
  return document.getElementById('senderId').value.trim() || 'user_1';
}

function addMessage(role, text, object) {
  const box = document.getElementById('chatBox');
  const div = document.createElement('div');
  const isUser = role === 'user';
  div.className = `flex ${isUser ? 'justify-end' : 'justify-start'}`;

  let content = '';
  if (text) {
    content = `<div class="${isUser ? 'bg-blue-600 text-white' : 'bg-white text-gray-800 border'} rounded-lg px-3 py-2 max-w-lg text-sm whitespace-pre-wrap">${escapeHtml(text)}</div>`;
  }
  if (object) {
    content += `<div class="mt-1 text-xs text-gray-400">📦 ${object.type}: ${object.title || object.id}</div>`;
  }

  div.innerHTML = `
    <div class="flex items-start gap-2 ${isUser ? 'flex-row-reverse' : ''}">
      <div class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold ${isUser ? 'bg-green-200 text-green-700' : 'bg-blue-200 text-blue-700'} shrink-0">
        ${isUser ? 'U' : 'B'}
      </div>
      ${content}
    </div>
  `;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function addSystemMessage(text) {
  const box = document.getElementById('chatBox');
  const div = document.createElement('div');
  div.className = 'text-center';
  div.innerHTML = `<span class="text-xs text-gray-400 bg-gray-100 px-2 py-0.5 rounded">${escapeHtml(text)}</span>`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function escapeHtml(str) {
  if (!str) return '';
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function showLoading() {
  const box = document.getElementById('chatBox');
  const div = document.createElement('div');
  div.id = 'loadingIndicator';
  div.className = 'flex justify-start';
  div.innerHTML = `
    <div class="flex items-start gap-2">
      <div class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold bg-blue-200 text-blue-700 shrink-0">B</div>
      <div class="bg-white border rounded-lg px-3 py-2 text-sm text-gray-400">
        <i class="fa fa-spinner fa-spin"></i> 思考中...
      </div>
    </div>
  `;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function hideLoading() {
  const el = document.getElementById('loadingIndicator');
  if (el) el.remove();
}

async function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';

  addMessage('user', text);
  showLoading();

  const useStream = document.getElementById('streamMode').checked;

  if (useStream) {
    try {
      const resp = await fetch(`${API_BASE}/api/chat/stream`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sender_id: getSenderId(), text }),
      });
      hideLoading();

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let currentBotDiv = null;
      let currentText = '';
      let hasContent = false;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop() || '';

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const payload = line.slice(6).trim();
          if (payload === '[DONE]') break;

          try {
            const data = JSON.parse(payload);
            if (data.type === 'header') {
              currentText = '';
              hasContent = true;
            } else if (data.type === 'chunk') {
              currentText += data.text;
              if (currentBotDiv) {
                currentBotDiv.innerHTML = escapeHtml(currentText);
              } else {
                const box = document.getElementById('chatBox');
                const div = document.createElement('div');
                div.className = 'flex justify-start';
                div.innerHTML = `
                  <div class="flex items-start gap-2">
                    <div class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold bg-blue-200 text-blue-700 shrink-0">B</div>
                    <div class="bg-white border rounded-lg px-3 py-2 max-w-lg text-sm whitespace-pre-wrap"></div>
                  </div>
                `;
                currentBotDiv = div.querySelector('.bg-white');
                box.appendChild(div);
                currentBotDiv.textContent = currentText;
              }
            } else if (data.type === 'done') {
              currentBotDiv = null;
            }
          } catch (e) { /* skip parse errors */ }
        }
      }
      if (!hasContent) addSystemMessage('未获取到回复');
    } catch (e) {
      hideLoading();
      addSystemMessage('流式请求失败: ' + e.message);
    }
  } else {
    try {
      const resp = await fetch(`${API_BASE}/api/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sender_id: getSenderId(), text }),
      });
      hideLoading();
      const data = await resp.json();
      if (data.messages) {
        for (const msg of data.messages) {
          addMessage('bot', msg.text, msg.object);
        }
      }
    } catch (e) {
      hideLoading();
      addSystemMessage('请求失败: ' + e.message);
    }
  }
}

function sendQuick(text) {
  document.getElementById('msgInput').value = text;
  sendMessage();
}

async function getSessionState() {
  const panel = document.getElementById('sessionPanel');
  panel.innerHTML = '<i class="fa fa-spinner fa-spin"></i> 加载中...';
  try {
    const resp = await fetch(`${API_BASE}/api/chat/session?sender_id=${encodeURIComponent(getSenderId())}`);
    const data = await resp.json();
    panel.innerHTML = `<pre class="text-xs">${escapeHtml(JSON.stringify(data, null, 2))}</pre>`;
    addSystemMessage('会话状态已更新');
  } catch (e) {
    panel.innerHTML = '获取失败: ' + e.message;
  }
}

async function getHistory() {
  addSystemMessage('加载历史消息...');
  try {
    const resp = await fetch(`${API_BASE}/api/chat/history?sender_id=${encodeURIComponent(getSenderId())}`);
    const data = await resp.json();
    if (data.messages) {
      document.getElementById('chatBox').innerHTML = '';
      for (const msg of data.messages) {
        addMessage(msg.role, msg.text, msg.object);
      }
    }
    addSystemMessage('历史消息加载完成');
  } catch (e) {
    addSystemMessage('获取历史失败: ' + e.message);
  }
}

function clearChat() {
  document.getElementById('chatBox').innerHTML = '';
  addSystemMessage('聊天已清空');
}
</script>
</body>
</html>
