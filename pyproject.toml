[project]
name = "edu-assist"
version = "0.1.0"
description = "教育智能客服系统"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.0",
    "uvicorn>=0.44.0",
    "langchain>=1.2.15",
    "langchain-openai>=1.1.14",
    "pydantic>=2.0",
    "pydantic-settings>=2.13.1",
    "sqlalchemy>=2.0.49",
    "aiomysql>=0.3.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
include = ["edu_assist*"]

[project.scripts]
start = "main:start"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
