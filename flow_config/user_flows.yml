# 教育智能客服 - 用户侧业务流程

slots:
  series_name:
    type: text
    label: 课程名称
    description: 用户咨询的课程系列名称

  cohort_name:
    type: text
    label: 班次名称
    description: 用户报名的班次名称

  cohort_id:
    type: text
    label: 班次 ID
    description: 班次的唯一标识

  order_number:
    type: text
    label: 订单号
    description: 用户的订单号

  refund_reason:
    type: text
    label: 退款原因
    description: 用户申请退款的原因说明

  refund_type:
    type: text
    label: 退款类型
    description: 退款类型，可选：personal_reason, course_unsatisfied, schedule_conflict, duplicate_purchase

  ticket_type:
    type: text
    label: 工单类型
    description: 工单类型，可选：after_sales, complaint, refund

  description:
    type: text
    label: 问题描述
    description: 用户遇到的问题描述

flows:
  # ========== 课程咨询流程 ==========
  course_consultation:
    name: 课程咨询
    description: 用户咨询课程信息，返回课程详情和班次安排
    steps:
      - id: start
        type: start
        next: ask_course_name

      - id: ask_course_name
        type: collect
        slot_name: series_name
        response:
          text: "你想了解哪门课程？请告诉我课程名称。"
        next: search_course

      - id: search_course
        type: action
        action: action_lookup_course_series
        args:
          series_name: "{{ slots.series_name }}"
        next:
          - if: "slots.get('series_name')"
            then: recommend_cohort
          - else: end

      - id: recommend_cohort
        type: action
        action: action_response
        args:
          mode: rephrase
          text: "以上是课程的基本信息。如果你想了解具体的班次安排或价格，请告诉我。"
          prompt: |
            你是一个中文教育客服助手。
            请基于建议回复，生成一句自然友好的回复，保持原意，不要扩写。
            对话上下文：
            {{ history }}
            用户最后一句：
            用户：{{ user_message }}
            建议回复：{{ current_response }}
            改写后的回复：
        next: ask_cohort

      - id: ask_cohort
        type: collect
        slot_name: cohort_name
        response:
          text: "你想了解哪个班次的详细信息？我可以为你介绍开课时间、价格和授课老师。"
        next: show_cohort

      - id: show_cohort
        type: action
        action: action_lookup_cohort
        args:
          cohort_name: "{{ slots.cohort_name }}"
        next: end

      - id: end
        type: end
        next: []

  # ========== 订单查询流程 ==========
  order_status_query:
    name: 订单查询
    description: 查询用户的订单状态和详情
    steps:
      - id: start
        type: start
        next: ask_order_number

      - id: ask_order_number
        type: collect
        slot_name: order_number
        response:
          text: "请告诉我你的订单号。"
        next: lookup_order

      - id: lookup_order
        type: action
        action: action_lookup_order
        args:
          order_number: "{{ slots.order_number }}"
        next: show_order

      - id: show_order
        type: action
        action: action_response
        args:
          mode: rephrase
          text: "订单{{ slots.order_number }}查询结果如上。请问还有什么需要帮助的吗？"
          prompt: |
            你是一个中文教育客服助手。
            请基于建议回复，生成一句自然友好的回复，保持原意，不要扩写。
            对话上下文：
            {{ history }}
            用户最后一句：
            用户：{{ user_message }}
            建议回复：{{ current_response }}
            改写后的回复：
        next: end

      - id: end
        type: end
        next: []

  # ========== 学习进度查询流程 ==========
  learning_progress_query:
    name: 学习进度查询
    description: 查询用户在指定班次的学习进度
    steps:
      - id: start
        type: start
        next: ask_cohort_name

      - id: ask_cohort_name
        type: collect
        slot_name: cohort_name
        response:
          text: "你想查询哪个班次的学习进度？请告诉我班次名称。"
        next: lookup_progress

      - id: lookup_progress
        type: action
        action: action_lookup_progress
        args:
          cohort_name: "{{ slots.cohort_name }}"
        next: show_progress

      - id: show_progress
        type: action
        action: action_response
        args:
          mode: rephrase
          text: "以上是你的学习进度报告。如果想了解更详细的信息，请告诉我。"
          prompt: |
            你是一个中文教育客服助手。
            请基于建议回复，生成一句自然友好的回复，保持原意，不要扩写。
            对话上下文：
            {{ history }}
            用户最后一句：
            用户：{{ user_message }}
            建议回复：{{ current_response }}
            改写后的回复：
        next: end

      - id: end
        type: end
        next: []

  # ========== 退款申请流程 ==========
  refund_request:
    name: 退款申请
    description: 用户提交退款申请
    steps:
      - id: start
        type: start
        next: ask_order_number

      - id: ask_order_number
        type: collect
        slot_name: order_number
        response:
          text: "请提供要退款的订单号。"
        next: ask_refund_reason

      - id: ask_refund_reason
        type: collect
        slot_name: refund_reason
        response:
          text: "请告诉我退款的原因。"
        next: ask_refund_type

      - id: ask_refund_type
        type: collect
        slot_name: refund_type
        response:
          text: "请选择退款类型：个人原因(personal_reason)、对课程不满意(course_unsatisfied)、时间冲突(schedule_conflict)、重复购买(duplicate_purchase)。"
        next: submit_refund

      - id: submit_refund
        type: action
        action: action_create_refund
        args:
          order_number: "{{ slots.order_number }}"
          refund_reason: "{{ slots.refund_reason }}"
          refund_type: "{{ slots.refund_type }}"
        next: refund_result

      - id: refund_result
        type: action
        action: action_response
        args:
          mode: rephrase
          text: "你的退款申请已提交，我们会尽快处理。退款编号请查看上方信息。"
          prompt: |
            你是一个中文教育客服助手。
            请基于建议回复，生成一句自然友好的回复，保持原意，不要扩写。
            对话上下文：
            {{ history }}
            用户最后一句：
            用户：{{ user_message }}
            建议回复：{{ current_response }}
            改写后的回复：
        next: end

      - id: end
        type: end
        next: []

  # ========== 工单提交流程 ==========
  ticket_submission:
    name: 工单提交
    description: 用户提交售后/投诉/退款工单
    steps:
      - id: start
        type: start
        next: ask_ticket_type

      - id: ask_ticket_type
        type: collect
        slot_name: ticket_type
        response:
          text: "请选择工单类型：售后问题(after_sales)、投诉(complaint)、退款(refund)。"
        next: ask_order_number

      - id: ask_order_number
        type: collect
        slot_name: order_number
        response:
          text: "请提供关联的订单号。"
        next: ask_description

      - id: ask_description
        type: collect
        slot_name: description
        response:
          text: "请详细描述你遇到的问题。"
        next: submit_ticket

      - id: submit_ticket
        type: action
        action: action_create_ticket
        args:
          ticket_type: "{{ slots.ticket_type }}"
          order_number: "{{ slots.order_number }}"
          description: "{{ slots.description }}"
        next: ticket_result

      - id: ticket_result
        type: action
        action: action_response
        args:
          mode: rephrase
          text: "工单已提交成功，我们会尽快处理。工单编号请查看上方信息。"
          prompt: |
            你是一个中文教育客服助手。
            请基于建议回复，生成一句自然友好的回复，保持原意，不要扩写。
            对话上下文：
            {{ history }}
            用户最后一句：
            用户：{{ user_message }}
            建议回复：{{ current_response }}
            改写后的回复：
        next: end

      - id: end
        type: end
        next: []

  # ========== 转人工客服（预留） ==========
  human_handoff:
    name: 转人工客服
    description: 将对话转接给人工客服处理
    steps:
      - id: start
        type: start
        next: transfer

      - id: transfer
        type: action
        action: action_response
        args:
          text: "正在为你转接人工客服，请稍候。转接成功后，人工客服会为你提供服务。"
        next: end

      - id: end
        type: end
        next: []
